# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Dependabot configuration must live on the repository's default branch (main).
# Dependabot will open PRs against the branch set by target-branch.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"    # Dependabot opens PRs against staging for verification
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Avoid automatically proposing/merging major (breaking) upgrades
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# Dependabot configuration - target staging so PRs are opened against staging for verification
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Ignore major version upgrades to avoid breaking changes automatically
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# Automatically merge non-breaking updates (optional):
# automerged_updates will attempt to merge selected updates when status checks pass.
# We merge semver-patch and semver-minor updates automatically into staging so you can
# verify them in the staging environment. If you prefer to review all PRs manually,
# remove the automerged_updates section.
automerged_updates:
  - match:
      update_type: "version-update:semver-patch"
    merge_method: "squash"
  - match:
      update_type: "version-update:semver-minor"
    merge_method: "squash"
